<!DOCTYPE html>
<html>
<head>
    <title>Instant LaTeX - Online LaTeX math formula editor</title>
    <meta name="description" content="Free online LaTeX math editor.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="main.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: "$$", right: "$$", display: true},
                    {left: "$", right: "$", display: false},
                    {left: "\\(", right: "\\)", display: false},
                    {left: "\\[", right: "\\]", display: true}
                ]
            });
        });
    </script>
</head>
<body>
    <div class="ide-container">
        <header class="ide-header">
            <div class="header-content">
                <h2>Instant LaTeX</h2>
                <p>Input LaTeX and TeX and get instant mathematics.</p>
            </div>
            <div class="header-actions">
                <a id="save-page" class="btn" href="#">Save page</a>
            </div>
        </header>

        <main class="split-pane">
            <section class="pane editor-pane">
                <textarea class="form-control" id="maths-editor" spellcheck="false">\frac{-b\pm\sqrt{b^2-4ac}}{2a}</textarea>
            </section>

            <section class="pane output-pane" id="math-output-container">
                <div id="math-output">
                    <p></p>
                </div>
                
                <div class="ad-container text-center">
                    <script async src="//pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
                    <!-- Instant Latex Below -->
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-1951638101090762"
                         data-ad-slot="9262527731"
                         data-ad-format="auto"></ins>
                    <script>
                        (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>
            </section>
        </main>
        
        <footer class="ide-footer text-center">
            <p>&copy; 2016 <a href="https://www.jonbaldie.com/">Jon Baldie</a></p>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
